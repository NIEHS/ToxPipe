# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:

  api:
    container_name: LibreChat
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
    image: ghcr.io/danny-avila/librechat:v0.8.3
    restart: always
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_API_URL=http://rag_api:8000
      - MEILI_NO_SYNC=true
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      - JWT_SECRET=${JWT_SECRET}

    volumes:
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./librechat.yaml:/app/librechat.yaml
    networks:
      - autonomous
    env_file:
      - .env

  mongodb:
    container_name: chat-mongodb
    image: mongo:7.0
    restart: always
    networks:
      - autonomous
    volumes:
      - mongodb-data:/data/db

  mongo-express: 
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH_ENABLED: true 
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    ports:
      - '8081:8081'
    depends_on:
      - mongodb
    restart: always
    networks:
      - autonomous

  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    networks:
      - autonomous
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meili-data:/meili_data

  rag_api: 
    # USE RAG API IMAGE WITH LOCAL EMBEDDINGS SUPPORT
    container_name: rag_api
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.7.0
    environment:
      - DB_HOST=vectordb
      - POSTGRES_USER=${VECTORDB_USER} 
      - POSTGRES_PASSWORD=${VECTORDB_PASSWORD}
      - POSTGRES_DB=${VECTORDB_DB}
      - OPENAI_API_BASE=http://litellm:8000
      - OPENAI_API_VERSION=2024-02-01
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
    restart: always
    depends_on:
      - vectordb
    networks:
      - autonomous
    env_file:
      - .env

  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${VECTORDB_USER}
      - POSTGRES_PASSWORD=${VECTORDB_PASSWORD}
      - POSTGRES_DB=${VECTORDB_DB}
    restart: always
    volumes:
      - librechat-pg:/var/lib/postgresql/data
    networks:
      - autonomous

  ollama:
    container_name: ollama
    image: ollama/ollama:0.13.5
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          capabilities: [compute, utility]
              #ports:
              #- 11434:11434
    volumes:
      - ollama:/root/.ollama
    networks:
      - autonomous

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:main-v1.80.11.rc.1
    ports:
      - '8000:8000'
    volumes:
      - ./.litellm/litellm-config.yaml:/app/config.yaml
    depends_on:
      litellm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      --config /app/config.yaml
      --port 8000
      --num_workers ${NUM_WORKERS}    
    environment:
      DATABASE_URL: postgresql://${LITELLM_USER}:${LITELLM_PASSWORD}@litellm-db:5432/${LITELLM_DB}
      AZURE_API_KEY: ${AZURE_API_KEY_LITELLM}
      AZURE_API_BASE: ${AZURE_API_BASE_LITELLM}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-server:3000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    networks:
      - autonomous

  litellm-db:
    image: postgres:16.4
    restart: always
    environment:
      - POSTGRES_USER=${LITELLM_USER}
      - POSTGRES_PASSWORD=${LITELLM_PASSWORD}
      - POSTGRES_DB=${LITELLM_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_USER} -d ${LITELLM_DB}"]    
    volumes:
      - litellm-pg:/var/lib/postgresql/data
    networks:
      - autonomous

  redis:
    # ADD LITELLM CACHING
    image: redis:7-alpine
    command:
    - sh
    - -c # this is to evaluate the $REDIS_PASSWORD from the env
    - redis-server --appendonly yes --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - autonomous
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  llama-index-mongodb:
    container_name: llama-index-mongodb
    image: mongo:8.2.3
    restart: always
    volumes:
      - llama-index-mongodb-data:/data/db
    networks:
      - autonomous

  chromadb:
    image: ghcr.io/chroma-core/chroma:1.3.0
    container_name: chromadb
    restart: always
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000" ]
      interval: 30s
      timeout: 3600s
      retries: 5
    volumes:
      - chroma-data:/data
    networks:
      - autonomous

  langflow:
    container_name: langflow
    image: langflowai/langflow:1.9.0
    depends_on:
      - postgres-langflow
    environment:
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD}
      - LANGFLOW_AUTO_LOGIN=false
      - LANGFLOW_DATABASE_URL=postgresql://${LANGFLOW_USER}:${LANGFLOW_PASSWORD}@postgres-langflow:5432/${LANGFLOW_DB}
      - LANGFLOW_NEW_USER_IS_ACTIVE=True
    ports:
      - "7860:7860"
    restart: always
    volumes:
      - langflow-data:/app/langflow
    networks:
      - autonomous

  postgres-langflow:
    container_name: postgres-langflow
    image: postgres:16
    environment:
      POSTGRES_USER: ${LANGFLOW_USER}
      POSTGRES_PASSWORD: ${LANGFLOW_PASSWORD}
      POSTGRES_DB: ${LANGFLOW_DB}
    restart: always
    volumes:
      - langflow-postgres:/var/lib/postgresql/data
    networks:
      - autonomous

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    ports:
      - 8888:8080
    networks:
      - autonomous

  dashy:
      image: lissy93/dashy:3.1
      networks:
        - autonomous
      ports:
        - 8082:8080
      volumes:
        - ./dashy/:/app/user-data/

  langfuse-worker:
    container_name: langfuse-worker
    image: docker.io/langfuse/langfuse-worker:3
    restart: always
    depends_on: &langfuse-depends-on
      langfuse-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis-langfuse:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - 3030:3030
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD} 
      CLICKHOUSE_CLUSTER_ENABLED: false
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD} 
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD} 
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      REDIS_HOST: redis-langfuse
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD} 
      LANGFUSE_DEBUG: true
    networks:
      - autonomous

  langfuse-server:
    container_name: langfuse-server
    image: docker.io/langfuse/langfuse:3
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - 3000:3000
    environment:
      <<: *langfuse-worker-env
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    networks:
      - autonomous

  clickhouse:
    container_name: clickhouse
    image: docker.io/clickhouse/clickhouse-server
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD} 
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ports:
      - 8123:8123
      - 9000:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    networks:
      - autonomous

  minio:
    container_name: minio
    image: docker.io/minio/minio
    restart: always
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD} 
    ports:
      - 9090:9000
      - 127.0.0.1:9091:9001
    volumes:
      - langfuse-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    networks:
      - autonomous

  redis-langfuse:
    container_name: redis-langfuse
    image: docker.io/redis:7
    restart: always
    command: >
      --requirepass ${REDIS_PASSWORD}
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-langfuse-data:/redis_langfuse_data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - autonomous

  langfuse-db:
    container_name: langfuse-db
    image: docker.io/postgres:17.7
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER} -d ${LANGFUSE_POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      - POSTGRES_USER=${LANGFUSE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${LANGFUSE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${LANGFUSE_POSTGRES_DB}
    ports:
      - 5435:5432
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks:
      - autonomous

volumes:
  mongodb-data:
  meili-data:
  librechat-pg:
  ollama:
  litellm-pg:
  redis-data:
  llama-index-mongodb-data:
  chroma-data:
  langflow-data:
  langflow-postgres:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  redis-langfuse-data:
  langfuse-postgres-data:

networks:
  autonomous:
    driver: bridge 
