# subdomains redirect
server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         *.toxpipe.niehs.nih.gov;

    # SSL
    ssl_certificate     /etc/nginx/toxpipe_niehs_nih_gov.crt;
    ssl_certificate_key /etc/nginx/toxpipe_niehs_nih_gov.key;
    return              301 https://toxpipe.niehs.nih.gov$request_uri;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name .toxpipe.niehs.nih.gov;
    return      301 https://toxpipe.niehs.nih.gov$request_uri;
}