server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         toxpipe.niehs.nih.gov;
    root                /var/www/toxpipe.niehs.nih.gov/public;

    # SSL
    ssl_certificate     /etc/nginx/toxpipe_niehs_nih_gov.crt;
    ssl_certificate_key /etc/nginx/toxpipe_niehs_nih_gov.key;

    # security
    include             nginxconfig.io/security.conf;

    # logging
    access_log          /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log           /var/log/nginx/error.log debug;

    # reverse proxy
    location / {
        include                 nginxconfig.io/proxy.conf;
        include                 nginxconfig.io/resolver.conf;
        set                     $upstream_app heimdall;
        set                     $upstream_proto https;
        proxy_set_header      Host $host;
        proxy_pass            $upstream_proto://$upstream_app;
    }

    # additional config
    include nginxconfig.io/general.conf;
}

# subdomains redirect
server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         *.toxpipe.niehs.nih.gov;

    # SSL
    ssl_certificate     /etc/nginx/toxpipe_niehs_nih_gov.crt;
    ssl_certificate_key /etc/nginx/toxpipe_niehs_nih_gov.key;
    return              301 https://toxpipe.niehs.nih.gov$request_uri;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name .toxpipe.niehs.nih.gov;
    return      301 https://toxpipe.niehs.nih.gov$request_uri;
}