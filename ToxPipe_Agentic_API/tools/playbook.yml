---
- hosts: servers
  become: yes
  tasks:
    - name: Ensure Docker is installed
      dnf:
        name: docker
        state: present

    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Ensure Nginx Docker container is running
      docker_container:
        name: nginx
        image: nginx:latest
        state: started
        published_ports:
          - "80:80"
          - "443:443"
        volumes:
          - "/path/to/nginx.conf:/etc/nginx/nginx.conf"
          - "/path/to/toxpipe_niehs_nih_gov.crt:/etc/nginx/toxpipe_niehs_nih_gov.crt"
          - "/path/to/toxpipe_niehs_nih_gov_chain.crt:/etc/nginx/toxpipe_niehs_nih_gov_chain.crt"
